<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#355C45" />
      <stop offset="50%" stop-color="#285744" />
      <stop offset="100%" stop-color="#183E33" />
    </linearGradient>
    <radialGradient id="bpGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <filter id="bpShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#122D25" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle Badge -->
  <rect x="20" y="20" width="472" height="472" rx="114" fill="url(#bpGrad)" />
  <rect x="20" y="20" width="472" height="472" rx="114" fill="url(#bpGlow)" />
  <rect x="22" y="22" width="468" height="468" rx="112" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6" />

  <!-- Heart and Pulse Symbol -->
  <g filter="url(#bpShadow)" transform="translate(256, 256) scale(15) translate(-12, -12)">
    <!-- Heart translucent fill -->
    <path
      d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"
      fill="rgba(255, 255, 255, 0.14)"
    />
    <!-- Heart outline -->
    <path
      d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Subtle pulse cyan aura -->
    <path
      d="M3 12.2h6.2l.8-1 1.6 4.4 2-8 1.6 4.6h5.8"
      fill="none"
      stroke="#ABC2A9"
      stroke-opacity="0.45"
      stroke-width="3.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Crisp pulse foreground -->
    <path
      d="M3 12.2h6.2l.8-1 1.6 4.4 2-8 1.6 4.6h5.8"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Live pulse indicator dot -->
    <circle cx="21" cy="12.2" r="1.3" fill="#ABC2A9" />
  </g>
</svg>